apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-web

spec:
  replicas: 1

  selector:
    matchLabels:
      app: django-web

  template:
    metadata:
      labels:
        app: django-web

    spec:
      containers:
        - name: django-web

          image: your-django-image:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          command:
            - sh
            - -c
            - |
              python manage.py makemigrations &&
              python manage.py migrate &&
              python manage.py runserver 0.0.0.0:8000

          env:
            - name: DB_NAME
              value: "mydb"

            - name: DB_USER
              value: "root"

            - name: DB_PASSWORD
              value: "1111"

            - name: DB_HOST
              value: "mysql-service"

            - name: DB_PORT
              value: "3306"

---
apiVersion: v1
kind: Service
metadata:
  name: django-service

spec:
  selector:
    app: django-web

  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080

  type: NodePort